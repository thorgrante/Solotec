name: solotik
description: Solotik hotspot voucher app for Android and Windows. Finds and connects routers on the local network.
publish_to: none
version: 1.0.10+11

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  file_selector: ^1.0.3
  path_provider: ^2.1.4
  crypto: ^3.0.6

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#6E1FC8"
  adaptive_icon_foreground: assets/icon-foreground.png
  min_sdk_android: 21
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256
