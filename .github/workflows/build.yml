name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform files
        run: |
          flutter create --org com --project-name solotik --platforms android .
          rm -rf test
      - run: flutter pub get
      - name: Patch plugins for the current Android build tools
        run: |
          # flutter_inappwebview_android 1.1.x still asks for proguard-android.txt, which new Android Gradle refuses
          for f in $HOME/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle; do
            sed -i "s/proguard-android.txt/proguard-android-optimize.txt/" "$f"; done
      - run: dart run flutter_launcher_icons
      - name: Check the code
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1; code=$?
          cat analyze.txt
          grep -E '^\s*error •' analyze.txt | head -40 | sed -E 's/^\s*error • (.*) • ([^ ]+):([0-9]+):([0-9]+) • .*/::error file=\2,line=\3,col=\4::\1/'
          exit $code
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.txt
      - name: Report build errors
        if: failure()
        run: |
          grep -E 'Error:|error:|What went wrong|FAILURE|Exception' build.txt 2>/dev/null | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true
      - run: cp build/app/outputs/flutter-apk/app-release.apk Solotik.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Solotik.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform files
        shell: bash
        run: |
          flutter create --org com --project-name solotik --platforms windows .
          rm -rf test
          sed -i 's/L"solotik"/L"Solotik"/' windows/runner/main.cpp
          sed -i 's/"FileDescription", "solotik"/"FileDescription", "Solotik"/; s/"ProductName", "solotik"/"ProductName", "Solotik"/' windows/runner/Runner.rc
          # flutter_inappwebview_windows still uses the old /await coroutines, which Visual Studio 2026 refuses by default
          sed -i '/^project(/a add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)' windows/CMakeLists.txt
          grep -n "SILENCE" windows/CMakeLists.txt
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee build.txt
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          grep -E 'error|Error|FAILED' build.txt 2>/dev/null | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Solotik-Windows.zip
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DSrc="$pwd\build\windows\x64\runner\Release" /DIcon="$pwd\windows\runner\resources\app_icon.ico" windows-installer\solotik.iss
          Copy-Item windows-installer\Output\Solotik-Setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Solotik-Setup.exe
            Solotik-Windows.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Old file names too (links on websites not yet updated)
        run: |
          cp out/Solotik.apk out/UnifiedTik.apk
          cp out/Solotik-Setup.exe out/UnifiedTik-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Solotik 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Android: Solotik.apk (install directly on the phone).
            Windows: Solotik-Setup.exe (installer) or Solotik-Windows.zip (unzip and run solotik.exe).
          files: |
            out/Solotik.apk
            out/Solotik-Setup.exe
            out/Solotik-Windows.zip
            out/UnifiedTik.apk
            out/UnifiedTik-Setup.exe
