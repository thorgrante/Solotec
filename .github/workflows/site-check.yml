name: Site check
# Checks that the website answers (for finding connection problems). Run by hand from the Actions tab.
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Which version is live
        run: |
          curl -s -m 30 https://unifiedtik.com/ -o page.html; echo "size $(wc -c < page.html)"
          for m in retryNet hv-bar a-keep "i18n.js?v=22"; do printf '%s: ' "$m"; grep -c "$m" page.html || true; done
      - name: Probe unifiedtik.com for 3 minutes
        run: |
          for i in $(seq 1 3); do
            for u in /api/health /api/portal/plans / ; do
              r=$(curl -s -o /tmp/b -w "%{http_code} %{time_total}s" -m 20 "https://unifiedtik.com$u" 2>&1 || echo "ERR $?")
              echo "$(date -u +%H:%M:%S) $u $r $(head -c 120 /tmp/b 2>/dev/null | tr '\n' ' ' | grep -o '^.\{0,120\}' | grep -v '<!doctype' )"
            done
            sleep 5
          done
      - name: Headers
        run: curl -sI -m 20 https://unifiedtik.com/api/health; curl -sI -m 20 https://unifiedtik.com/
      - name: Log in (wrong password, to time the answer)
        run: |
          for i in 1 2 3; do curl -s -o /tmp/l -w "%{http_code} %{time_total}s\n" -m 30 -X POST -H 'Content-Type: application/json' -d '{"email":"probe@example.com","password":"not-a-real-password"}' https://unifiedtik.com/api/portal/login; head -c 200 /tmp/l; echo; done
